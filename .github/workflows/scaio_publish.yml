# Runs when a merged content PR lands social drafts on main. Pages publishes the
# article on its own; this posts the social queue once the article is live and
# records the results in social/posted/.
name: SCAIO publish

on:
  push:
    branches: [main]
    paths: ["social/queue/**"]
  workflow_dispatch: {}      # retry the queue by hand, e.g. after adding credentials

permissions:
  contents: write

concurrency:
  group: scaio-publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Post social queue
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}
        run: python execution/scaio_social_post.py

      - name: Record posted items
        run: |
          git add -A social
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Social: record posted drafts"
            git push
          fi
